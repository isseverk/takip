  - ad: Can Ataklı
    kaynaklar:
      - tur: sayfa
        etiket: Nefes
        url: https://www.nefes.com.tr/yazarlar/can-atakli
        link_deseni: '/yazarlar/can-atakli/.+-\d+$'

  - ad: Murat Ağırel
    kaynaklar:
      - tur: sayfa
        etiket: Cumhuriyet
        url: https://www.cumhuriyet.com.tr/yazarlar/murat-agirel
        link_deseni: '/yazarlar/murat-agirel/.+-\d+$'

  - ad: Sinan Meydan
    sessizlik_gun: 16   # haftada bir yazıyor
    kaynaklar:
      - tur: sayfa
        etiket: Cumhuriyet
        url: https://www.cumhuriyet.com.tr/yazarlar/sinan-meydan
        link_deseni: '/yazarlar/sinan-meydan/.+-\d+$'

  - ad: Barış Terkoğlu
    kaynaklar:
      - tur: sayfa
        etiket: Cumhuriyet
        url: https://www.cumhuriyet.com.tr/yazarlar/baris-terkoglu
