  - ad: Faruk Bildirici
    sessizlik_gun: 16   # haftada bir yazıyor
    kaynaklar:
      - tur: rss
        etiket: farukbildirici.com
        url: https://www.farukbildirici.com/feed/
        kesfet: https://www.farukbildirici.com/
      - tur: sayfa
        etiket: BirGün
