# ─────────────────────────────────────────────────────────────
#  TAKİP AKIŞI — AYAR DOSYASI
#  Yazar eklemek/çıkarmak için yalnızca bu dosyayı düzenlemen yeterli.
#  Bir kaynağı geçici kapatmak için altına  aktif: false  yaz.
#  Satır başlarındaki boşluklar önemlidir (sekme değil, boşluk kullan).
# ─────────────────────────────────────────────────────────────

ayarlar:
  site_basligi: "Takip Akışım"
  # GitHub Pages adresin (kurulumdan sonra doldur; bildirimlerdeki bağlantı buraya gider)
  site_adresi: ""
  # Bir kaynak ilk kez eklendiğinde akışa konacak en son yazı sayısı
  ilk_calistirmada_goster: 3
  # Akışta kaç günlük içerik tutulsun
  akista_tutulacak_gun: 45
  # Telefona anlık bildirim (isteğe bağlı): ntfy uygulamasını kur, kimsenin tahmin
  # edemeyeceği bir konu adı uydur (ör. takip-akis-7k2q9x), uygulamada o konuya abone ol
  # ve aynı adı aşağıya yaz. Boş bırakırsan bildirim gönderilmez.
  bildirim:
    ntfy_konu: ""
  # Yazarlar hâlâ aynı yerde mi yazıyor? Program her çalışmada bunu da denetler.
  adres_denetimi:
    # Bu kadar gün yeni yazı gelmezse "sessiz" uyarısı verir.
    # Haftada bir yazanlar için yazara özel  sessizlik_gun: 16  gibi bir değer yazabilirsin.
    sessizlik_gun: 10
    # Google Haberler'de yazarın son 30 günde hangi sitelerde göründüğünü kaç günde bir tarasın
    # (sessiz kalan yazarlar bunun üçte biri sıklıkla taranır)
    tarama_gun: 7

# ─────────────────────────────────────────────────────────────
#  KAYNAK TÜRLERİ
#   sayfa       : yazarın "tüm yazıları" sayfası. link_deseni, yazı bağlantılarını
#                 ayırt eden kalıptır (yazılmazsa program kendisi tahmin eder).
#                 yazar_dizini + bul: yazar sayfası adresi bilinmiyorsa, sitenin
#                 yazarlar listesinden isimle bulur.
#                 dogrula: true → yeni yazının sayfasında yazar adı geçiyor mu bakar.
#   rss         : RSS/Atom akışı. yazar_filtresi ile sadece o yazarın yazıları alınır.
#   youtube     : kanal: https://www.youtube.com/@kanaladi  (kısa videolar atlanır)
#   eksi_yazar  : kullanici: ekşi nick'i  → o yazarın yeni entry'leri
#   eksi_baslik : url: başlık adresi       → başlığa yazılan yeni entry'ler
#   instagram   : kullanici: hesap adı. Instagram çoğu zaman engeller; kalıcı çözüm
#                 için rss_url: (RSS.app vb. servisin verdiği adres) ekle.
#   bluesky     : kullanici: hesap.bsky.social → kendi paylaşımları (yanıtlar atlanır)
#   telegram    : kullanici: kanaladi          → herkese açık kanalın mesajları
#   podcast     : url: Apple Podcasts / Spotify show adresi ya da podcastin RSS'i
# ─────────────────────────────────────────────────────────────

yazarlar:

  - ad: Fatih Altaylı
    kaynaklar:
      - tur: sayfa
        etiket: fatihaltayli.com.tr
        url: https://fatihaltayli.com.tr/yazilar/fatih-altayli/kose-yazilari
        link_deseni: '/yazarlar/fatih-altayli/\d{4}-\d{2}-\d{2}/'

  - ad: Murat Yetkin
    kaynaklar:
      - tur: rss
        etiket: Yetkin Report
        url: https://yetkinreport.com/feed/
        yazar_filtresi: Murat Yetkin

  - ad: Barış Pehlivan
    kaynaklar:
      - tur: sayfa
        etiket: Cumhuriyet
        url: https://www.cumhuriyet.com.tr/yazarlar/baris-pehlivan
        link_deseni: '/yazarlar/baris-pehlivan/.+-\d+$'

  - ad: İsmail Saymaz
    kaynaklar:
      - tur: sayfa
        etiket: Sözcü
        url: https://www.sozcu.com.tr/ismail-saymaz-a36
        link_deseni: 'sozcu\.com\.tr/[a-z0-9-]+-p\d+$'
        dogrula: true

  - ad: Mahfi Eğilmez
    kaynaklar:
      - tur: rss
        etiket: Kendime Yazılar
        url: https://www.mahfiegilmez.com/feeds/posts/default
        kesfet: https://www.mahfiegilmez.com/

  - ad: Uğur Gürses
    sessizlik_gun: 16   # haftada bir yazıyor
    kaynaklar:
      - tur: sayfa
        etiket: Oksijen
        url: https://gazeteoksijen.com/yazarlar/ugur-gurses
        link_deseni: 'gazeteoksijen\.com/yazarlar/ugur-gurses/.+-\d+$'
        dogrula: true
        # Oksijen bulut sunucularını engelliyor; Google Haberler yedeğinde adı her sayfada geçtiği için
        # adresi çözülemeyen sonuçları alma (yalnızca köşe yazısı olduğu kesin olanlar gelsin)
        yedek_dogrula: true

  - ad: Soner Yalçın
    kaynaklar:
      - tur: sayfa
        etiket: Nefes
        url: https://www.nefes.com.tr/yazarlar/soner-yalcin
