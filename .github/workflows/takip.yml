name: Takip akışını güncelle

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "kaynaklar.yaml"
      - "kaynaklar_uygulama.json"
      - "sablon.html"
      - "uygulama/**"
      - "takip.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: takip
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Kaynakları kontrol et
        env:
          TZ: Europe/Istanbul
          NTFY_KONU: ${{ secrets.NTFY_KONU }}
        run: python takip.py

      - name: Sonuçları kaydet
        run: |
          git config user.name "takip-botu"
          git config user.email "takip-botu@users.noreply.github.com"
          git add veri docs
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Akış güncellendi $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: yayin
        uses: actions/deploy-pages@v4
